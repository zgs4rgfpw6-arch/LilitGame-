<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILIT CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .brand-title {
            color: #ff2a75;
            letter-spacing: 2px;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .balance-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .main-heading {
            text-align: center;
            letter-spacing: 4px;
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 42, 117, 0.4);
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        .menu-card {
            background: #13131a;
            border: 1px solid rgba(255, 42, 117, 0.2);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .menu-card:active {
            transform: scale(0.98);
            border-color: rgba(255, 42, 117, 0.6);
        }
        .menu-card span {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        .sub-text {
            font-size: 0.75rem;
            color: #8e8e93;
            margin-top: 2px;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .back-btn {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 0.9rem;
            padding: 0;
            margin-bottom: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Главное меню -->
    <div id="main-menu" class="screen active">
        <div class="header-top">
            <div class="brand-title">LILIT</div>
            <div class="balance-badge">🎰 <span id="user-balance">3 050</span></div>
        </div>

        <div class="main-heading">Game</div>

        <div class="menu-card" onclick="showScreen('games-menu')">
            <div>
                <span>♠ ИГРЫ</span>
            </div>
            <span style="color: #ff2a75;">→</span>
        </div>

        <div class="menu-card" onclick="showScreen('friends-screen')">
            <div>
                <span>♣ ДРУЗЬЯ</span>
            </div>
            <span style="color: #ff2a75;">→</span>
        </div>

        <div class="menu-card" onclick="showScreen('profile-screen')">
            <div>
                <span>♦ ПРОФИЛЬ</span>
                <div class="sub-text" id="profile-username-sub">Игрок</div>
            </div>
            <span style="color: #ff2a75;">→</span>
        </div>

        <div class="menu-card" onclick="alert('Выход из приложения')">
            <div>
                <span style="color: #ff5252;">♥ ВЫХОД</span>
            </div>
            <span style="color: #ff5252;">✕</span>
        </div>
    </div>

    <!-- Меню выбора игр -->
    <div id="games-menu" class="screen">
        <button class="back-btn" onclick="showScreen('main-menu')">← Назад в меню</button>
        <div class="main-heading" style="font-size: 1.3rem;">Игры</div>

        <div class="menu-card" onclick="showScreen('durak-lobby')">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="font-size: 1.5rem; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 10px;">🃏</div>
                <div>
                    <span>ДУРАК</span>
                    <div class="sub-text">Классический подкидной / переводной</div>
                </div>
            </div>
            <span style="color: #ff2a75;">→</span>
        </div>

        <div class="menu-card" onclick="alert('Скоро появится!')">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="font-size: 1.5rem; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 10px;">♠</div>
                <div>
                    <span>BLACK JACK</span>
                    <div class="sub-text">Собери 21 очко против дилера</div>
                </div>
            </div>
            <span style="color: #ff2a75;">→</span>
        </div>
    </div>

    <!-- Лобби Дурака -->
    <div id="durak-lobby" class="screen">
        <button class="back-btn" onclick="showScreen('games-menu')">← К выбору игр</button>
        <div class="main-heading" style="font-size: 1.3rem;">ДУРАК</div>
        
        <div style="display: grid; gap: 12px; margin-top: 20px;">
            <button class="menu-card" style="justify-content: center; background: #ff2a75; color: #fff; border: none;" onclick="showScreen('durak-game-table')">
                <span style="font-size: 1.1rem;">Создать стол</span>
            </button>
            <button class="menu-card" onclick="alert('Поиск активных игр...')">
                <span>Найти комнату</span>
                <span>🔍</span>
            </button>
        </div>
    </div>

    <!-- Игровой стол Дурака -->
    <div id="durak-game-table" class="screen text-center">
        <button class="back-btn" style="float: left;" onclick="showScreen('durak-lobby')">✕ Выйти</button>
        <div style="clear: both; height: 40px;"></div>
        <h4 style="color: #ff2a75; letter-spacing: 2px;">ПАРТИЯ В ДУРАКА</h4>
        <div style="background: #13131a; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 40px 20px; margin-top: 30px;">
            <p style="color: #8e8e93; margin: 0;">Ожидание оппонента или раздача карт...</p>
        </div>
    </div>

    <!-- Экран Друзей -->
    <div id="friends-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main-menu')">← Назад в меню</button>
        <div class="main-heading" style="font-size: 1.3rem;">ДРУЗЬЯ</div>
        <div class="menu-card">
            <span>Реферальная ссылка</span>
            <span style="color: #ff2a75;" onclick="alert('Ссылка скопирована!')">🔗</span>
        </div>
    </div>

    <!-- Профиль -->
    <div id="profile-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main-menu')">← Назад в меню</button>
        <div class="main-heading" style="font-size: 1.3rem;">ПРОФИЛЬ</div>
        <div class="menu-card">
            <div>
                <span id="profile-username">Игрок</span>
                <div class="sub-text">Telegram ID: <span id="profile-id">—</span></div>
            </div>
        </div>
    </div>

    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                const user = window.Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    const name = user.first_name || user.username || 'Игрок';
                    document.getElementById('profile-username').textContent = name;
                    const sub = document.getElementById('profile-username-sub');
                    if (sub) sub.textContent = '@' + (user.username || 'id' + user.id);
                    document.getElementById('profile-id').textContent = user.id;
                }
            }
        });
    </script>
</body>
</html>
