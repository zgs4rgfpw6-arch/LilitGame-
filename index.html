<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILIT CASINO</title>
    <!-- Подключаем Telegram WebApp JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 20px; 
        }
        .neon-text { 
            text-shadow: 0 0 10px rgba(255, 193, 7, 0.5); 
        }
        .screen { 
            display: none; 
        }
        .screen.active { 
            display: block; 
        }
    </style>
</head>
<body class="bg-dark text-light">

    <!-- Главное меню -->
    <div id="main-menu" class="screen active text-center py-4">
        <h1 class="neon-text text-warning mb-4">LILIT CASINO</h1>
        <div class="d-grid gap-3 col-8 mx-auto">
            <button class="btn btn-warning btn-lg fw-bold" onclick="showScreen('games-menu')">Игры</button>
            <button class="btn btn-outline-light btn-lg" onclick="showScreen('profile-screen')">Профиль</button>
        </div>
    </div>

    <!-- Меню игр -->
    <div id="games-menu" class="screen py-3">
        <button class="btn btn-sm btn-outline-secondary mb-3" onclick="showScreen('main-menu')">← Назад</button>
        <h3 class="text-warning mb-3">Выбор игры</h3>
        <div class="d-grid gap-3">
            <button class="btn btn-primary btn-lg" onclick="showScreen('durak-lobby')">Карточный Дурак</button>
        </div>
    </div>

    <!-- Лобби Дурака -->
    <div id="durak-lobby" class="screen py-3">
        <button class="btn btn-sm btn-outline-secondary mb-3" onclick="showScreen('games-menu')">← Назад</button>
        <h3 class="text-warning">Дурак: Лобби</h3>
        <div class="d-grid gap-3 mt-4">
            <button class="btn btn-success btn-lg" onclick="showScreen('durak-game-table')">Создать игру</button>
            <button class="btn btn-outline-warning" onclick="showScreen('durak-settings')">Настройки</button>
        </div>
    </div>

    <!-- Настройки Дурака -->
    <div id="durak-settings" class="screen py-3">
        <button class="btn btn-sm btn-outline-secondary mb-3" onclick="showScreen('durak-lobby')">← Назад</button>
        <h3 class="text-warning">Настройки игры</h3>
        <p class="text-muted mt-3">Параметры колоды и режима.</p>
    </div>

    <!-- Игровой стол -->
    <div id="durak-game-table" class="screen py-3 text-center">
        <button class="btn btn-sm btn-outline-secondary mb-3 float-start" onclick="showScreen('durak-lobby')">Выход</button>
        <h4 class="text-warning mb-5">Игровой стол</h4>
        <div class="p-5 border border-secondary rounded bg-black">
            <p class="text-muted">Идет партия в дурака...</p>
        </div>
    </div>

    <!-- Профиль -->
    <div id="profile-screen" class="screen py-3">
        <button class="btn btn-sm btn-outline-secondary mb-3" onclick="showScreen('main-menu')">← Назад</button>
        <h3 class="text-warning">Профиль игрока</h3>
        <p class="mt-3">Имя: <span id="profile-username" class="fw-bold text-info">Игрок</span></p>
    </div>

    <!-- Логика переключения экранов -->
    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                const user = window.Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    const el = document.getElementById('profile-username');
                    if (el) el.textContent = user.first_name || user.username || 'Игрок';
                }
            }
        });
    </script>
</body>
</html>
