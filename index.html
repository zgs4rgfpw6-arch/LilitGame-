<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILIT CASINO</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Lexend:wght@500;600;700&display=swap');

        body {
            background-color: #060608;
            margin: 0;
            padding: 16px;
            font-family: 'Lexend', sans-serif;
        }

        /* Шапка */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 
                0 0 4px #fff,
                0 0 10px #ff0055,
                0 0 20px #ff0055,
                0 0 35px #ff0055,
                0 0 60px #ff0055;
        }

        .balance-badge {
            background: #0d0d12;
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 24px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
        }

        .balance-plus {
            color: #ff2a75;
            font-size: 1rem;
            font-weight: 700;
        }

        .balance-chip {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-value {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Центральный логотип */
        .logo-box-container {
            display: flex;
            justify-content: center;
            margin-top: 35px;
            margin-bottom: 30px;
        }

        .logo-frame {
            position: relative;
            border: 1px solid rgba(255, 0, 85, 0.4);
            border-radius: 16px;
            padding: 24px 35px;
            text-align: center;
            background: rgba(13, 13, 18, 0.6);
            box-shadow: 
                0 0 15px rgba(255, 0, 85, 0.15),
                inset 0 0 15px rgba(255, 0, 85, 0.05);
        }

        .logo-lilit {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #fff,
                0 0 15px #ff0055,
                0 0 30px #ff0055;
            margin: 0;
            line-height: 1;
        }

        .logo-game {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #ff2a75;
            position: absolute;
            bottom: 6px;
            right: 25px;
            text-shadow: 
                0 0 8px #ff0055,
                0 0 20px rgba(255, 0, 85, 0.6);
            margin: 0;
            line-height: 1;
            transform: rotate(-3deg);
        }

        /* Блок меню */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .menu-card {
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.25);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 42, 117, 0.08);
        }

        .menu-card:active {
            transform: scale(0.98);
            border-color: rgba(255, 42, 117, 0.6);
        }

        .menu-card-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Цвета мастей для иконок */
        .card-icon-pink {
            color: #ff2a75;
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
            text-shadow: 0 0 8px rgba(255, 42, 117, 0.5);
        }

        .card-icon-blue {
            color: #00d2ff;
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
        }

        .card-title {
            font-family: 'Lexend', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .arrow-icon {
            color: #ffffff;
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="header-top">
        <div class="brand-title">LILIT</div>
        
        <div class="balance-badge">
            <span class="balance-plus">+</span>
            <div class="balance-chip">
                <span>💳</span>
                <span class="balance-value">0</span>
            </div>
        </div>
    </div>

    <!-- Центральный логотип -->
    <div class="logo-box-container">
        <div class="logo-frame">
            <h1 class="logo-lilit">LILIT</h1>
            <p class="logo-game">game</p>
        </div>
    </div>

    <!-- Меню -->
    <div class="menu-container">
        <div class="menu-card" onclick="alert('Игры')">
            <div class="menu-card-content">
                <span class="card-icon-pink">♠</span>
                <span class="card-title">ИГРЫ</span>
            </div>
            <span class="arrow-icon">→</span>
        </div>

        <div class="menu-card" onclick="alert('Друзья')">
            <div class="menu-card-content">
                <span class="card-icon-blue">♣</span>
                <span class="card-title">ДРУЗЬЯ</span>
            </div>
            <span class="arrow-icon">→</span>
        </div>

        <div class="menu-card" onclick="alert('Профиль')">
            <div class="menu-card-content">
                <span class="card-icon-pink">♦</span>
                <span class="card-title">ПРОФИЛЬ</span>
            </div>
            <span class="arrow-icon">→</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>
</body>
</html>
