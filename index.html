<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILIT CASINO</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Lexend:wght@500;600;700&display=swap');

        body {
            background-color: #060608;
            margin: 0;
            padding: 16px;
            font-family: 'Lexend', sans-serif;
        }

        /* Управление экранами */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* Общая шапка */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand-title {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 
                0 0 4px #fff,
                0 0 10px #ff0055,
                0 0 20px #ff0055,
                0 0 35px #ff0055,
                0 0 60px #ff0055;
        }

        .balance-badge {
            background: #0d0d12;
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 24px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
        }

        .balance-plus {
            color: #ff2a75;
            font-size: 1rem;
            font-weight: 700;
        }

        .balance-chip {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-value {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Кнопка назад */
        .back-btn {
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.3);
            border-radius: 12px;
            color: #ffffff;
            padding: 8px 16px;
            font-family: 'Lexend', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
            border-color: rgba(255, 42, 117, 0.7);
        }

        .section-title {
            color: #ffffff;
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #fff,
                0 0 15px #ff0055;
            margin: 0;
        }

        /* АНИМАЦИЯ НЕОНОВОЙ ВЫВЕСКИ ЦЕЛИКОМ */
        @keyframes signFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                filter: drop-shadow(0 0 12px rgba(255, 0, 85, 0.4));
            }
            20%, 24%, 55% {
                opacity: 0.75;
                filter: drop-shadow(0 0 2px rgba(255, 0, 85, 0.1));
            }
        }

        /* Центральный логотип главного экрана */
        .logo-box-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            margin-bottom: 30px;
            animation: signFlicker 3.5s infinite;
        }

        .logo-frame {
            position: relative;
            border: 1px solid rgba(255, 0, 85, 0.45);
            border-radius: 16px;
            padding: 24px 35px;
            text-align: center;
            background: rgba(13, 13, 18, 0.6);
            box-shadow: 
                0 0 15px rgba(255, 0, 85, 0.2),
                inset 0 0 15px rgba(255, 0, 85, 0.05);
        }

        .logo-lilit {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #fff,
                0 0 15px #ff0055,
                0 0 30px #ff0055;
            margin: 0;
            line-height: 1;
        }

        .logo-game {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #ff2a75;
            position: absolute;
            bottom: 6px;
            right: 25px;
            text-shadow: 
                0 0 8px #ff0055,
                0 0 20px rgba(255, 0, 85, 0.6);
            margin: 0;
            line-height: 1;
            transform: rotate(-3deg);
        }

        /* Общие контейнеры меню */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .menu-card {
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.25);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 42, 117, 0.08);
        }

        .menu-card:active {
            transform: scale(0.98);
            border-color: rgba(255, 42, 117, 0.6);
        }

        .menu-card-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Иконки мастей */
        .card-icon-pink {
            color: #ff2a75;
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
            text-shadow: 0 0 8px rgba(255, 42, 117, 0.5);
        }

        .card-icon-blue {
            color: #00d2ff;
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
        }

        .card-icon-mint {
            color: #50e3c2;
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
            text-shadow: 0 0 8px rgba(80, 227, 194, 0.5);
        }

        .card-title {
            font-family: 'Lexend', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .arrow-icon {
            color: #ffffff;
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="screen-main" class="screen active">
        <div class="header-top">
            <div class="brand-title">LILIT</div>
            <div class="balance-badge">
                <span class="balance-plus">+</span>
                <div class="balance-chip">
                    <span>💳</span>
                    <span class="balance-value">0</span>
                </div>
            </div>
        </div>

        <div class="logo-box-container">
            <div class="logo-frame">
                <h1 class="logo-lilit">LILIT</h1>
                <p class="logo-game">game</p>
            </div>
        </div>

        <div class="menu-container">
            <div class="menu-card" onclick="triggerHaptic(); switchScreen('screen-games')">
                <div class="menu-card-content">
                    <span class="card-icon-pink">♠</span>
                    <span class="card-title">ИГРЫ</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="triggerHaptic(); alert('Друзья')">
                <div class="menu-card-content">
                    <span class="card-icon-blue">♣</span>
                    <span class="card-title">ДРУЗЬЯ</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="triggerHaptic(); alert('Профиль')">
                <div class="menu-card-content">
                    <span class="card-icon-pink">♦</span>
                    <span class="card-title">ПРОФИЛЬ</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="triggerHaptic(); alert('Выход')">
                <div class="menu-card-content">
                    <span class="card-icon-mint">♥</span>
                    <span class="card-title">ВЫХОД</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>
        </div>
    </div>


    <!-- ЭКРАН 2: ИГРЫ -->
    <div id="screen-games" class="screen">
        <div class="header-top">
            <button class="back-btn" onclick="triggerHaptic(); switchScreen('screen-main')">← Назад</button>
            <h2 class="section-title">Игры</h2>
            <div style="width: 70px;"></div>
        </div>

        <div class="menu-container" style="margin-top: 20px;">
            <div class="menu-card" onclick="triggerHaptic(); alert('Запуск игры: Дурак')">
                <div class="menu-card-content">
                    <span class="card-icon-pink">♠</span>
                    <span class="card-title">ДУРАК</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="triggerHaptic(); alert('Запуск игры: Blackjack')">
                <div class="menu-card-content">
                    <span class="card-icon-blue">♣</span>
                    <span class="card-title">BLACKJACK</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="triggerHaptic(); alert('Запуск игры: Рулетка')">
                <div class="menu-card-content">
                    <span class="card-icon-mint">♥</span>
                    <span class="card-title">РУЛЕТКА</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>
        </div>
    </div>


    <script>
        // Универсальная функция вибрации (Telegram API + запасной вариант для мобильных браузеров)
        function triggerHaptic() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            } else if (navigator.vibrate) {
                navigator.vibrate(35);
            }
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>
</body>
</html>
