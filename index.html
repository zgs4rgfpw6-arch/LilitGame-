<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lilit Neon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #060608;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            min-height: 100vh;
        }

        /* Наша надпись Lilit с неоновым свечением */
        .brand-title {
            font-family: 'Lexend', sans-serif;
            /* Насыщенный неоново-розовый оттенок */
            color: #ff2a75;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            /* Многослойное неоновое свечение: мягкий ореол + яркое ядро */
            text-shadow: 
                0 0 8px rgba(255, 42, 117, 0.6),
                0 0 20px rgba(255, 42, 117, 0.4),
                0 0 35px rgba(255, 42, 117, 0.2);
        }
    </style>
</head>
<body>

    <div class="brand-title">LILIT</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>
</body>
</html>
