<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILIT CASINO</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap');

        body {
            background-color: #060608;
            margin: 0;
            padding: 16px;
            font-family: 'Lexend', sans-serif;
        }

        /* Шапка */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 
                0 0 4px #fff,
                0 0 10px #ff0055,
                0 0 20px #ff0055,
                0 0 35px #ff0055,
                0 0 60px #ff0055;
        }

        .balance-badge {
            background: #0d0d12;
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 24px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
        }

        .balance-plus {
            color: #ff2a75;
            font-size: 1rem;
            font-weight: 700;
        }

        .balance-chip {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chip-icon {
            font-size: 1rem;
        }

        .balance-value {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Центральный логотип/заголовок */
        .hero-logo-container {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .hero-sub {
            font-size: 0.75rem;
            letter-spacing: 5px;
            color: #7c7c85;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .hero-main {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #fff,
                0 0 15px #ff0055,
                0 0 30px #ff0055,
                0 0 50px #ff0055;
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="header-top">
        <div class="brand-title">LILIT</div>
        
        <div class="balance-badge">
            <span class="balance-plus">+</span>
            <div class="balance-chip">
                <span class="chip-icon">💳</span>
                <span class="balance-value">0</span>
            </div>
        </div>
    </div>

    <!-- Центральный заголовок-логотип -->
    <div class="hero-logo-container">
        <div class="hero-sub">L i l i t</div>
        <div class="hero-main">GAME</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>
</body>
</html>
