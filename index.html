<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILIT CASINO</title>
    
    <!-- Подключение официального скрипта Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Lexend:wght@500;600;700&display=swap');

        body {
            background-color: #060608;
            margin: 0;
            padding: 16px;
            padding-top: 90px;
            font-family: 'Lexend', sans-serif;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand-title {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 
                0 0 4px #fff,
                0 0 10px #ff0055,
                0 0 20px #ff0055,
                0 0 35px #ff0055,
                0 0 60px #ff0055;
        }

        .balance-badge {
            background: #0d0d12;
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 24px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
        }

        .balance-plus {
            color: #ff2a75;
            font-size: 1rem;
            font-weight: 700;
        }

        .balance-chip {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-value {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .back-btn {
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.3);
            border-radius: 12px;
            color: #ffffff;
            padding: 8px 16px;
            font-family: 'Lexend', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
            border-color: rgba(255, 42, 117, 0.7);
        }

        .section-title {
            color: #ffffff;
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #fff,
                0 0 15px #ff0055;
            margin: 0;
        }

        @keyframes signFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                filter: drop-shadow(0 0 12px rgba(255, 0, 85, 0.4));
            }
            20%, 24%, 55% {
                opacity: 0.75;
                filter: drop-shadow(0 0 2px rgba(255, 0, 85, 0.1));
            }
        }

        .logo-box-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            margin-bottom: 30px;
            animation: signFlicker 3.5s infinite;
        }

        .logo-frame {
            position: relative;
            border: 1px solid rgba(255, 0, 85, 0.45);
            border-radius: 16px;
            padding: 24px 35px;
            text-align: center;
            background: rgba(13, 13, 18, 0.6);
            box-shadow: 
                0 0 15px rgba(255, 0, 85, 0.2),
                inset 0 0 15px rgba(255, 0, 85, 0.05);
        }

        .logo-lilit {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #fff,
                0 0 15px #ff0055,
                0 0 30px #ff0055;
            margin: 0;
            line-height: 1;
        }

        .logo-game {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #ff2a75;
            position: absolute;
            bottom: 6px;
            right: 25px;
            text-shadow: 
                0 0 8px #ff0055,
                0 0 20px rgba(255, 0, 85, 0.6);
            margin: 0;
            line-height: 1;
            transform: rotate(-3deg);
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .menu-card {
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.25);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 42, 117, 0.08);
        }

        .menu-card:active {
            transform: scale(0.98);
            border-color: rgba(255, 42, 117, 0.6);
        }

        .menu-card-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon-pink { color: #ff2a75; font-size: 1.1rem; width: 22px; text-align: center; text-shadow: 0 0 8px rgba(255, 42, 117, 0.5); }
        .card-icon-blue { color: #00d2ff; font-size: 1.1rem; width: 22px; text-align: center; text-shadow: 0 0 8px rgba(0, 210, 255, 0.5); }
        .card-icon-mint { color: #50e3c2; font-size: 1.1rem; width: 22px; text-align: center; text-shadow: 0 0 8px rgba(80, 227, 194, 0.5); }

        .card-title {
            font-family: 'Lexend', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .arrow-icon {
            color: #ffffff;
            font-size: 1rem;
            opacity: 0.8;
        }

        .profile-user-card {
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.3);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 400px;
            margin: 20px auto 0 auto;
            box-shadow: 0 0 15px rgba(255, 42, 117, 0.1);
        }

        .profile-avatar-wrapper {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 42, 117, 0.5);
            flex-shrink: 0;
            background: #0d0d12;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(255, 42, 117, 0.3);
        }

        .profile-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar-placeholder {
            font-size: 1.8rem;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .profile-name {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-details-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-username {
            color: #00d2ff;
            font-size: 0.85rem;
            font-weight: 500;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        .profile-id-badge {
            background: rgba(255, 42, 117, 0.12);
            border: 1px solid rgba(255, 42, 117, 0.35);
            border-radius: 8px;
            padding: 2px 8px;
            color: #ff2a75;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .profile-id-badge:active {
            transform: scale(0.95);
            background: rgba(255, 42, 117, 0.25);
        }

        /* Стили для раздела Друзья */
        .friends-tabs {
            display: flex;
            gap: 8px;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }

        .friend-tab {
            flex: 1;
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.2);
            border-radius: 12px;
            padding: 10px;
            color: #8c8c99;
            font-family: 'Lexend', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .friend-tab.active {
            background: rgba(255, 42, 117, 0.15);
            border-color: rgba(255, 42, 117, 0.6);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 42, 117, 0.15);
        }

        .friends-content-section {
            display: none;
            max-width: 400px;
            margin: 0 auto;
        }

        .friends-content-section.active {
            display: block;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            background: #111116;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-family: 'Lexend', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: rgba(0, 210, 255, 0.8);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .action-btn {
            background: linear-gradient(135deg, #ff0055, #ff2a75);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            padding: 0 20px;
            font-family: 'Lexend', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.3);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .friend-card {
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.25);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(255, 42, 117, 0.05);
        }

        .friend-card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .friend-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #0d0d12;
            border: 1px solid rgba(255, 42, 117, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            overflow: hidden;
        }

        .friend-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .friend-name {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .friend-id {
            color: #ff2a75;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .mini-btn {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 10px;
            color: #00d2ff;
            padding: 6px 12px;
            font-family: 'Lexend', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mini-btn:active {
            transform: scale(0.95);
        }

        .mini-btn-danger {
            background: rgba(255, 42, 117, 0.15);
            border-color: rgba(255, 42, 117, 0.4);
            color: #ff2a75;
        }

        .empty-text {
            color: #8c8c99;
            text-align: center;
            font-size: 0.9rem;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="screen-main" class="screen active">
        <div class="header-top">
            <div class="brand-title">LILIT</div>
            <div class="balance-badge">
                <span class="balance-plus">+</span>
                <div class="balance-chip">
                    <span>💳</span>
                    <span class="balance-value">0</span>
                </div>
            </div>
        </div>

        <div class="logo-box-container">
            <div class="logo-frame">
                <h1 class="logo-lilit">LILIT</h1>
                <p class="logo-game">game</p>
            </div>
        </div>

        <div class="menu-container">
            <div class="menu-card" onclick="switchScreen('screen-games')">
                <div class="menu-card-content">
                    <span class="card-icon-pink">♠</span>
                    <span class="card-title">ИГРЫ</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="switchScreen('screen-friends')">
                <div class="menu-card-content">
                    <span class="card-icon-blue">♣</span>
                    <span class="card-title">ДРУЗЬЯ</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="switchScreen('screen-profile')">
                <div class="menu-card-content">
                    <span class="card-icon-pink">♦</span>
                    <span class="card-title">ПРОФИЛЬ</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="alert('Выход')">
                <div class="menu-card-content">
                    <span class="card-icon-mint">♥</span>
                    <span class="card-title">ВЫХОД</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>
        </div>
    </div>


    <!-- ЭКРАН 2: ИГРЫ -->
    <div id="screen-games" class="screen">
        <div class="header-top">
            <button class="back-btn" onclick="switchScreen('screen-main')">← Назад</button>
            <h2 class="section-title">Игры</h2>
            <div style="width: 70px;"></div>
        </div>

        <div class="menu-container" style="margin-top: 20px;">
            <div class="menu-card" onclick="alert('Запуск игры: Дурак')">
                <div class="menu-card-content">
                    <span class="card-icon-pink">♠</span>
                    <span class="card-title">ДУРАК</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="alert('Запуск игры: Blackjack')">
                <div class="menu-card-content">
                    <span class="card-icon-blue">♣</span>
                    <span class="card-title">BLACKJACK</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="alert('Запуск игры: Рулетка')">
                <div class="menu-card-content">
                    <span class="card-icon-mint">♥</span>
                    <span class="card-title">РУЛЕТКА</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>
        </div>
    </div>


    <!-- ЭКРАН 3: ПРОФИЛЬ -->
    <div id="screen-profile" class="screen">
        <div class="header-top">
            <button class="back-btn" onclick="switchScreen('screen-main')">← Назад</button>
            <h2 class="section-title">Профиль</h2>
            <div style="width: 70px;"></div>
        </div>

        <!-- Блок пользователя -->
        <div class="profile-user-card">
            <div class="profile-avatar-wrapper">
                <img id="tg-avatar" src="" alt="Avatar" class="profile-avatar-img" style="display: none;">
                <div id="tg-avatar-placeholder" class="profile-avatar-placeholder">💀</div>
            </div>
            <div class="profile-info">
                <div class="profile-name" id="tg-name">Загрузка...</div>
                <div class="profile-details-row">
                    <div class="profile-username" id="tg-username" style="display: none;">@username</div>
                    <div class="profile-id-badge" id="tg-game-id" onclick="copyGameId()" title="Нажмите, чтобы скопировать ID">ID: ----</div>
                </div>
            </div>
        </div>
    </div>


    <!-- ЭКРАН 4: ДРУЗЬЯ -->
    <div id="screen-friends" class="screen">
        <div class="header-top">
            <button class="back-btn" onclick="switchScreen('screen-main')">← Назад</button>
            <h2 class="section-title">Друзья</h2>
            <div style="width: 70px;"></div>
        </div>

        <!-- Вкладки друзей -->
        <div class="friends-tabs">
            <div class="friend-tab active" onclick="switchFriendTab('friends-list-tab', this)">Список (0)</div>
            <div class="friend-tab" onclick="switchFriendTab('friends-add-tab', this)">Поиск</div>
            <div class="friend-tab" onclick="switchFriendTab('friends-req-tab', this)">Запросы (0)</div>
        </div>

        <!-- 1. Список друзей -->
        <div id="friends-list-tab" class="friends-content-section active">
            <div id="friends-container">
                <div class="empty-text">У вас пока нет друзей в списке. Найдите игрока по ID!</div>
            </div>
        </div>

        <!-- 2. Поиск и добавление -->
        <div id="friends-add-tab" class="friends-content-section">
            <div class="search-box">
                <input type="text" id="search-id-input" class="search-input" placeholder="Введите ID (#XXXX)..." maxlength="5">
                <button class="action-btn" onclick="searchUserById()">Найти</button>
            </div>
            <div id="search-result-container"></div>
        </div>

        <!-- 3. Входящие запросы -->
        <div id="friends-req-tab" class="friends-content-section">
            <div id="requests-container">
                <div class="empty-text">Нет новых входящих запросов.</div>
            </div>
        </div>
    </div>


    <script>
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        let userGameId = "";
        
        // Моковые базы для демонстрации поиска и запросов (в будущем заменится на сервер)
        let mockUsersDB = [
            { id: "0042", name: "Кирилл", avatar: "🤖" },
            { id: "7777", name: "Victoria_Queen", avatar: "👑" },
            { id: "1337", name: "CyberDemon", avatar: "🔥" }
        ];

        let myFriends = [];
        let incomingRequests = [
            { id: "7777", name: "Victoria_Queen", avatar: "👑" } // Для примера сразу дадим один входящий запрос
        ];

        document.addEventListener('DOMContentLoaded', () => {
            let tgUser = null;

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            }

            if (!tgUser || !tgUser.first_name) {
                tgUser = {
                    id: 6912925240,
                    first_name: "Игрок",
                    username: "",
                    photo_url: null
                };
            }

            if (tgUser.id === 6912925240) {
                userGameId = "0001";
            } else {
                const numericId = tgUser.id || 1000;
                userGameId = String((numericId % 9000) + 1000);
            }

            document.getElementById('tg-game-id').textContent = `ID: #${userGameId}`;

            if (tgUser.first_name) {
                const fullName = tgUser.last_name ? `${tgUser.first_name} ${tgUser.last_name}` : tgUser.first_name;
                document.getElementById('tg-name').textContent = fullName;
            }
            
            const usernameEl = document.getElementById('tg-username');
            if (tgUser.username && tgUser.username.trim() !== "") {
                usernameEl.textContent = `@${tgUser.username}`;
                usernameEl.style.display = 'block';
            } else {
                usernameEl.style.display = 'none';
            }

            if (tgUser.photo_url) {
                const avatarImg = document.getElementById('tg-avatar');
                avatarImg.src = tgUser.photo_url;
                avatarImg.style.display = 'block';
                document.getElementById('tg-avatar-placeholder').style.display = 'none';
            }

            updateFriendsUI();
        });

        function copyGameId() {
            if (!userGameId) return;
            navigator.clipboard.writeText(`#${userGameId}`).then(() => {
                const badge = document.getElementById('tg-game-id');
                const originalText = badge.textContent;
                badge.textContent = "СКОПИРОВАНО!";
                setTimeout(() => {
                    badge.textContent = originalText;
                }, 1500);
            });
        }

        // Переключение вкладок в разделе Друзья
        function switchFriendTab(tabId, tabElement) {
            document.querySelectorAll('.friends-content-section').forEach(sec => {
                sec.classList.remove('active');
            });
            document.querySelectorAll('.friend-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            tabElement.classList.add('active');
        }

        // Поиск пользователя по ID
        function searchUserById() {
            let query = document.getElementById('search-id-input').value.trim();
            query = query.replace('#', ''); // убираем решетку, если ввели
            const container = document.getElementById('search-result-container');

            if (!query || query.length < 4) {
                container.innerHTML = `<div class="empty-text" style="color: #ff2a75;">Введите корректный 4-значный ID</div>`;
                return;
            }

            if (query === userGameId) {
                container.innerHTML = `<div class="empty-text">Это ваш собственный ID!</div>`;
                return;
            }

            // Ищем в моковой базе (можно добавить поиск себя или других)
            let foundUser = mockUsersDB.find(u => u.id === query);

            if (foundUser) {
                container.innerHTML = `
                    <div class="friend-card" style="margin-top: 15px;">
                        <div class="friend-card-info">
                            <div class="friend-avatar">${foundUser.avatar}</div>
                            <div>
                                <div class="friend-name">${foundUser.name}</div>
                                <div class="friend-id">ID: #${foundUser.id}</div>
                            </div>
                        </div>
                        <button class="mini-btn" onclick="sendFriendRequest('${foundUser.id}')" id="req-btn-${foundUser.id}">Добавить</button>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="empty-text">Игрок с ID #${query} не найден</div>`;
            }
        }

        // Отправка запроса в друзья
        function sendFriendRequest(targetId) {
            const btn = document.getElementById(`req-btn-${targetId}`);
            btn.textContent = "ЗАПРОС ОТПРАВЛЕН";
            btn.style.color = "#8c8c99";
            btn.style.borderColor = "rgba(140, 140, 153, 0.4)";
            btn.style.background = "transparent";
            btn.disabled = true;
        }

        // Принять входящий запрос
        function acceptRequest(targetId) {
            let reqIndex = incomingRequests.findIndex(r => r.id === targetId);
            if (reqIndex !== -1) {
                let friend = incomingRequests.splice(reqIndex, 1)[0];
                myFriends.push(friend);
                updateFriendsUI();
            }
        }

        // Отклонить входящий запрос
        function rejectRequest(targetId) {
            incomingRequests = incomingRequests.filter(r => r.id !== targetId);
            updateFriendsUI();
        }

        // Обновление интерфейса списков друзей и счетчиков на вкладках
        function updateFriendsUI() {
            // 1. Обновляем вкладку Списка друзей
            const friendsContainer = document.getElementById('friends-container');
            if (myFriends.length === 0) {
                friendsContainer.innerHTML = `<div class="empty-text">У вас пока нет друзей в списке. Найдите игрока по ID!</div>`;
            } else {
                friendsContainer.innerHTML = myFriends.map(f => `
                    <div class="friend-card">
                        <div class="friend-card-info">
                            <div class="friend-avatar">${f.avatar}</div>
                            <div>
                                <div class="friend-name">${f.name}</div>
                                <div class="friend-id">ID: #${f.id}</div>
                            </div>
                        </div>
                        <button class="mini-btn mini-btn-danger" onclick="removeFriend('${f.id}')">Удалить</button>
                    </div>
                `).join('');
            }

            // 2. Обновляем вкладку Запросов
            const reqContainer = document.getElementById('requests-container');
            if (incomingRequests.length === 0) {
                reqContainer.innerHTML = `<div class="empty-text">Нет новых входящих запросов.</div>`;
            } else {
                reqContainer.innerHTML = incomingRequests.map(r => `
                    <div class="friend-card">
                        <div class="friend-card-info">
                            <div class="friend-avatar">${r.avatar}</div>
                            <div>
                                <div class="friend-name">${r.name}</div>
                                <div class="friend-id">ID: #${r.id}</div>
                            </div>
                        </div>
                        <div style="display: flex; gap: 6px;">
                            <button class="mini-btn" onclick="acceptRequest('${r.id}')">Принять</button>
                            <button class="mini-btn mini-btn-danger" onclick="rejectRequest('${r.id}')">Х</button>
                        </div>
                    </div>
                `).join('');
            }

            // Обновляем тексты на кнопках-вкладках
            document.querySelectorAll('.friend-tab')[0].textContent = `Список (${myFriends.length})`;
            document.querySelectorAll('.friend-tab')[2].textContent = `Запросы (${incomingRequests.length})`;
        }

        function removeFriend(friendId) {
            myFriends = myFriends.filter(f => f.id !== friendId);
            updateFriendsUI();
        }
    </script>
</body>
</html>
