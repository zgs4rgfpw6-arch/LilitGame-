<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILIT CASINO</title>
    <link rel="stylesheet" href="style_bj.css">
    
    <!-- Подключение официального скрипта Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Lexend:wght@500;600;700&display=swap');

        body {
            background-color: #060608;
            margin: 0;
            padding: 16px;
            padding-top: 90px;
            font-family: 'Lexend', sans-serif;
            color: #ffffff;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand-title {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 
                0 0 4px #fff,
                0 0 10px #ff0055,
                0 0 20px #ff0055,
                0 0 35px #ff0055,
                0 0 60px #ff0055;
        }

        .balance-badge {
            background: #0d0d12;
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 24px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
        }

        .balance-plus {
            color: #ff2a75;
            font-size: 1rem;
            font-weight: 700;
        }

        .balance-chip {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-value {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .back-btn {
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.3);
            border-radius: 12px;
            color: #ffffff;
            padding: 8px 16px;
            font-family: 'Lexend', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
            border-color: rgba(255, 42, 117, 0.7);
        }

        .section-title {
            color: #ffffff;
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #fff,
                0 0 15px #ff0055;
            margin: 0;
        }

        @keyframes signFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                filter: drop-shadow(0 0 12px rgba(255, 0, 85, 0.4));
            }
            20%, 24%, 55% {
                opacity: 0.75;
                filter: drop-shadow(0 0 2px rgba(255, 0, 85, 0.1));
            }
        }

        .logo-box-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            margin-bottom: 30px;
            animation: signFlicker 3.5s infinite;
        }

        .logo-frame {
            position: relative;
            border: 1px solid rgba(255, 0, 85, 0.45);
            border-radius: 16px;
            padding: 24px 35px;
            text-align: center;
            background: rgba(13, 13, 18, 0.6);
            box-shadow: 
                0 0 15px rgba(255, 0, 85, 0.2),
                inset 0 0 15px rgba(255, 0, 85, 0.05);
        }

        .logo-lilit {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #fff,
                0 0 15px #ff0055,
                0 0 30px #ff0055;
            margin: 0;
            line-height: 1;
        }

        .logo-game {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #ff2a75;
            position: absolute;
            bottom: 6px;
            right: 25px;
            text-shadow: 
                0 0 8px #ff0055,
                0 0 20px rgba(255, 0, 85, 0.6);
            margin: 0;
            line-height: 1;
            transform: rotate(-3deg);
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .menu-card {
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.25);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 42, 117, 0.08);
        }

        .menu-card:active {
            transform: scale(0.98);
            border-color: rgba(255, 42, 117, 0.6);
        }

        .menu-card-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon-pink { color: #ff2a75; font-size: 1.1rem; width: 22px; text-align: center; text-shadow: 0 0 8px rgba(255, 42, 117, 0.5); }
        .card-icon-blue { color: #00d2ff; font-size: 1.1rem; width: 22px; text-align: center; text-shadow: 0 0 8px rgba(0, 210, 255, 0.5); }
        .card-icon-mint { color: #50e3c2; font-size: 1.1rem; width: 22px; text-align: center; text-shadow: 0 0 8px rgba(80, 227, 194, 0.5); }

        .card-title {
            font-family: 'Lexend', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .arrow-icon {
            color: #ffffff;
            font-size: 1rem;
            opacity: 0.8;
        }

        .game-screen-bj {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            max-width: 400px;
            margin: 0 auto;
        }

        .bj-table-section {
            background: #111116;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 16px;
            padding: 14px;
            width: 100%;
            margin-bottom: 12px;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1);
        }

        .bj-table-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #00d2ff;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-container {
            display: flex;
            gap: 8px;
            min-height: 125px;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow-x: auto;
        }

        .game-message {
            text-align: center;
            color: #ff2a75;
            font-weight: 600;
            font-size: 0.95rem;
            margin: 6px 0;
            min-height: 24px;
            text-shadow: 0 0 8px rgba(255, 42, 117, 0.4);
        }

        .bj-controls {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }

        .neon-btn {
            flex: 1;
            background: linear-gradient(135deg, #00ffaa, #00d2ff);
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Lexend', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 0 12px rgba(0, 255, 170, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .neon-btn:active {
            transform: scale(0.95);
        }

        .neon-btn:disabled {
            background: #1a1a24;
            color: #555566;
            box-shadow: none;
            cursor: not-allowed;
        }

        .bj-bet-section {
            background: #111116;
            border: 1px solid rgba(255, 42, 117, 0.3);
            border-radius: 16px;
            padding: 12px 14px;
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bj-bet-chips {
            display: flex;
            gap: 6px;
        }
        .bj-bet-btn {
            background: rgba(255, 42, 117, 0.15);
            border: 1px solid rgba(255, 42, 117, 0.4);
            border-radius: 8px;
            color: #ff2a75;
            padding: 6px 10px;
            font-family: 'Lexend', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="screen-main" class="screen active">
        <div class="header-top">
            <div class="brand-title">LILIT</div>
            <div class="balance-badge">
                <span class="balance-plus">+</span>
                <div class="balance-chip">
                    <span>💳</span>
                    <span class="balance-value" id="header-balance">0</span>
                </div>
            </div>
        </div>

        <div class="logo-box-container">
            <div class="logo-frame">
                <h1 class="logo-lilit">LILIT</h1>
                <p class="logo-game">game</p>
            </div>
        </div>

        <div class="menu-container">
            <div class="menu-card" onclick="gameManager.switchScreen('screen-games')">
                <div class="menu-card-content">
                    <span class="card-icon-pink">♠</span>
                    <span class="card-title">ИГРЫ</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="gameManager.switchScreen('screen-blackjack')">
                <div class="menu-card-content">
                    <span class="card-icon-blue">♣</span>
                    <span class="card-title">BLACKJACK</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>

            <div class="menu-card" onclick="gameManager.closeApp()">
                <div class="menu-card-content">
                    <span class="card-icon-mint">♥</span>
                    <span class="card-title">ВЫХОД</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ИГРЫ -->
    <div id="screen-games" class="screen">
        <div class="header-top">
            <button class="back-btn" onclick="gameManager.switchScreen('screen-main')">← Назад</button>
            <h2 class="section-title">Игры</h2>
            <div style="width: 70px;"></div>
        </div>

        <div class="menu-container" style="margin-top: 20px;">
            <div class="menu-card" onclick="gameManager.switchScreen('screen-blackjack')">
                <div class="menu-card-content">
                    <span class="card-icon-blue">♣</span>
                    <span class="card-title">BLACKJACK</span>
                </div>
                <span class="arrow-icon">→</span>
            </div>
        </div>
    </div>

    <!-- ЭКРАН БЛЭКДЖЕКА -->
    <div id="screen-blackjack" class="screen">
        <div class="header-top">
            <button class="back-btn" onclick="gameManager.switchScreen('screen-games')">← Назад</button>
            <h2 class="section-title" style="font-size: 1.1rem;">Blackjack</h2>
            <div class="balance-badge" style="padding: 4px 10px;">
                <span class="balance-plus" style="font-size: 0.85rem;">+</span>
                <div class="balance-chip">
                    <span style="font-size: 0.85rem;">💳</span>
                    <span class="balance-value" id="bj-balance-value" style="font-size: 0.85rem;">0</span>
                </div>
            </div>
        </div>

        <div class="game-screen-bj">
            <!-- Зона дилера -->
            <div class="bj-table-section">
                <div class="bj-table-header">
                    <span>ДИЛЕР</span>
                    <span>Очки: <span id="dealer-score">—</span></span>
                </div>
                <div id="dealer-cards" class="card-container"></div>
            </div>

            <!-- Сообщение -->
            <div id="bj-message" class="game-message">Сделайте ставку и раздайте карты</div>

            <!-- Зона игрока -->
            <div class="bj-table-section">
                <div class="bj-table-header">
                    <span>ИГРОК</span>
                    <span>Очки: <span id="player-score">0</span></span>
                </div>
                <div id="player-cards" class="card-container"></div>
            </div>

            <!-- Блок ставки -->
            <div class="bj-bet-section">
                <div class="bj-bet-info">Ставка: <span id="current-bet">100</span></div>
                <div class="bj-bet-chips">
                    <button class="bj-bet-btn" onclick="if(typeof changeBet === 'function') changeBet(50)">+50</button>
                    <button class="bj-bet-btn" onclick="if(typeof changeBet === 'function') changeBet(100)">+100</button>
                    <button class="bj-bet-btn" onclick="if(typeof changeBet === 'function') changeBet(500)">+500</button>
                    <button class="bj-bet-btn" onclick="if(typeof resetBet === 'function') resetBet()">Сброс</button>
                </div>
            </div>

            <!-- Кнопки управления игрой -->
            <div class="bj-controls">
                <button id="btn-deal" class="neon-btn" onclick="if(typeof startBlackjack === 'function') startBlackjack()">Раздать</button>
                <button id="btn-hit" class="neon-btn" onclick="if(typeof playerHit === 'function') playerHit()" disabled>Ещё</button>
                <button id="btn-stand" class="neon-btn" style="background: linear-gradient(135deg, #ff0055, #ff2a75); color: #fff;" onclick="if(typeof playerStand === 'function') playerStand()" disabled>Хватит</button>
            </div>
        </div>
    </div>

    <!-- Подключаем скрипты управления -->
    <script src="gameManager.js"></script>
    <script src="blackjack.js"></script>
</body>
</html>
