<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lilit</title>
    
    <!-- Надежное подключение шрифта Lexend через CSS -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@700&display=swap');

        body {
            background-color: #060608;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .brand-title {
            font-family: 'Lexend', sans-serif;
            /* Белое сияющее ядро текста для максимальной читаемости */
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            
            /* Мощный неоновый шлейф и цветное свечение вокруг */
            text-shadow: 
                0 0 4px #fff,
                0 0 10px #ff0055,
                0 0 20px #ff0055,
                0 0 35px #ff0055,
                0 0 60px #ff0055;
        }
    </style>
</head>
<body>

    <div class="brand-title">LILIT</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });
    </script>
</body>
</html>
